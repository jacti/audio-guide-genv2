playlist_title: "국립중앙박물관 필수 스팟 가이드"
description: "국중박에서 꼭 들러야 하는 필수 스팟만 모은 핵심 투어 가이드 (사진 명소 + 국보/보물 포함)"
playlist_output_dir_name: "1130_national_museum_photo_spots"

metadata:
  author: "국립중앙박물관"
  version: "1.1"
  tags: ["guide", "museum", "photo_spot", "seoul", "treasure"]
  created_date: "2025-11-29"

defaults:
  perplexity_model: "sonar-pro"
  info_retrieval_prompt_template_name: "universal_retrieval.yaml"
  script_gen_prompt_template_name: "unniversal_script_gen.yaml"
  voice: "Laomedeia"
  gemini_tts_model: "gemini-2.5-pro-tts"
  script_gen_model: "gpt-5.1"
  tts_language: "ko-KR"
  temperature: 0.7

files:
  # =======================
  # 0. 가이드 소개
  # =======================
  - output_name: "00_intro"
    info_retrieval_user_content_text: |
      [조사 주제: 국립중앙박물관 필수 스팟 가이드 소개]
      전체 전시를 다 보지 못해도 핵심만 볼 수 있도록 구성된 큐레이션 코스.
      이 가이드에서 다루는 스팟 목록:
      1) 국중박 입구 남산타워 전망
      2) 고구려 강서대묘 사신도
      3) 신라 금관과 금허리띠(국보)
      4) 신라 진흥왕 순수비(국보)
      5) 경천사 십층석탑(국보)
      6) 통일신라 철불
      7) 사유의 방 - 반가사유상(국보)
      8) 외규장각 의궤 전시실
      9) 도자공예실 - 분청사기·백자
      10) 뮤즈(Muse) 굿즈샵
      보너스: 옛 보신각 동종(보물)

      각 스팟은 사진 명소 또는 국보·보물급 주요 유물임.
      이 코스는 짧은 시간 안에 “국중박의 하이라이트”를 체험할 수 있도록 설계됨.
    script_gen_user_content_text: |
      [톤] 밝고 힘찬 여행 시작 톤.
      [지시사항]
      1. 검색된 스팟 목록을 기반으로, “이런 명소들을 앞으로 함께 보게 된다”는 예고 멘트를 만들어주세요.
      2. 스팟 하나하나의 상세 설명은 하지 말고, 전체 코스의 분위기와 기대감을 중심으로 설명해주세요.
      3. “핵심만 쏙 골라보는 알짜배기 투어”라는 느낌을 강조해주세요.
      4. 제공된 모든 스팟을 전부 나열할 필요는 없습니다.
      [금지사항]
      - 스팟별 역사적 상세 묘사 금지.

  # =======================
  # 1. 남산타워 전망
  # =======================
  - output_name: "01_namsan_tower_view"
    info_retrieval_user_content_text: |
      [조사 주제: 남산타워 전망]
      국립중앙박물관 입구에서 남산타워가 잘 보이는 전망 포인트.
      사진 명소로 유명함.
      어느 시간대가 아름다운지 검색(특히 노을).
    script_gen_user_content_text: |
      [지시사항]
      1. 사진 명소 특성을 강조해 "관람 시작을 알리는 첫 사진 스팟"이라는 느낌으로 설명해주세요.
      2. 남산타워와 박물관을 함께 담는 구도, 추천 시간대(특히 노을 무렵)를 말해 주세요.
      3. 박물관에 들어가기 전 가벼운 설렘을 느끼도록 분위기를 살려주세요.
      4. 점프 샷 등 다양한 포즈를 추천해주세요.
      5. 박물관 역사·유물 이야기는 하지 마세요.

  # =======================
  # 2. 강서대묘 사신도
  # =======================
  - output_name: "02_gangseodaemyo_mural"
    info_retrieval_user_content_text: |
      [조사 주제: 강서대묘 사신도]
      고구려 고분벽화 강서대묘의 사신도.
      사신: 청룡·백호·주작·현무.
      벽화가 가진 동적 표현.
      https://ko.wikipedia.org/wiki/강서대묘
    script_gen_user_content_text: |
      [지시사항]
      1. 사진 명소 특성을 강조해 생생한 시각적 묘사 중심으로 설명해주세요.
      2. 네 사신을 시각적으로 떠올릴 수 있게 묘사하고, 고구려 벽화의 역동성을 전달해주세요.

  # =======================
  # 3. 신라 금관과 허리띠
  # =======================
  - output_name: "03_silla_gold_crown"
    info_retrieval_user_content_text: |
      [조사 주제: 신라 금관과 허리띠]
      신라 왕실의 금관·금허리띠.
      국보.
      왕권 상징.
      경주 APEC 정상회의에서 트럼프 대통령에게 선물한 일화 검색.
      https://www.museum.go.kr/MUSEUM/contents/M0201030800.do?schM=view&showHallId=760&relicId=85
    script_gen_user_content_text: |
      [지시사항]
      1. 사진 명소 특성을 강조해 고급스럽고 흥미로운 스토리를 중심으로 설명해주세요.
      2. 유물 앞에 섰을 때 보이는 황금빛, 섬세한 장식, 머릿속에 ‘왕’이 떠오르는 느낌을 중심으로 설명해주세요.
      3. APEC·트럼프 이야기를 가볍게 삽입해주세요.

  # =======================
  # 4. 신라 진흥왕 순수비
  # =======================
  - output_name: "04_silla_jinheungwang_monument"
    info_retrieval_user_content_text: |
      [조사 주제: 신라 진흥왕 순수비]
      신라 진흥왕 순수비.
      국보.
      진흥왕의 순수·영토 확장과 관련됨.
      비석의 고대 한글 아닌 한자 비문 특징.
    script_gen_user_content_text: |
      [톤] 무게감 있는 톤.
      [지시사항]
      1. 사진 명소 특성을 강조하되, 순수비가 무엇인지 간결하게 설명해주세요.
      2. 돌비석 앞에서 옛 사람들의 글씨를 들여다보는 장면을 상상하며 설명해주세요.
      3. “어디까지가 우리 땅인지 흔적을 남기고 싶었던 왕의 마음” 같은 식으로, 영토 확장의 상징성을 짧게 언급해주세요.
      4. 역사 전체를 강의하듯 길게 설명하지 말고, 비석이라는 물건 자체가 주는 현장감에 집중해주세요.

  # =======================
  # 5. 경천사 십층석탑
  # =======================
  - output_name: "05_gyeongcheonsa_pagoda"
    info_retrieval_user_content_text: |
      [조사 주제: 경천사 십층석탑]
      고려 말 제작된 경천사 십층석탑.
      국보임.
      국립중앙박물관 1층 중앙홀에 위치.
      https://www.museum.go.kr/MUSEUM/contents/M0201101000.do?schM=view&showHallId=406012&relicId=17738
    script_gen_user_content_text: |
      [톤] 웅장·압도적.
      [지시사항]
      1. 사진 명소 특성을 강조해 1층 중앙홀에 들어섰을 때 시야를 가득 채우는 ‘압도감’을 중심으로 설명해주세요.
      2. 층층이 쌓인 조각 디테일을 따라 위로 올려다보는 경험을 묘사해주세요.
      3. 사진 촬영 시 추천 거리·각도를 제시해주세요.

  # =======================
  # 6. 통일신라 철불
  # =======================
  - output_name: "06_unified_silla_iron_buddha"
    info_retrieval_user_content_text: |
      [조사 주제: 통일신라 철불]
      국립중앙박물관 통일신라 철불.
      普願寺址出土統一新羅鐵製如來坐像. 일제강점기이던 1918년, 충청남도 서산시 운산면의 보원사(普願寺) 절터에서 출토된 8~9세기 통일신라 시대의 철제불상 1점. 한반도에 현존하는 가장 오래된 철불
      https://namu.wiki/w/%EB%B3%B4%EC%9B%90%EC%82%AC%EC%A7%80%20%EC%B6%9C%ED%86%A0%20%EC%B2%A0%EC%A0%9C%EC%97%AC%EB%9E%98%EC%A2%8C%EC%83%81
    script_gen_user_content_text: |
      [톤] 웅장하고 느긋한 톤.
      [지시사항]
      1. 사진 명소 특성을 강조해 웅장감을 묘사해주세요.
      2. 금속 질감과 빛 반사를 묘사하고, 추천 촬영 각도를 안내해주세요.

  # =======================
  # 7. 사유의 방 — 반가사유상
  # =======================
  - output_name: "07_room_of_quiet_contemplation"
    info_retrieval_user_content_text: |
      [조사 주제: 사유의 방]
      사유의 방 전시실.
      국보 반가사유상 두 점.
      어둡고 명상적 분위기와 조명 연출.
      https://www.museum.go.kr/MUSEUM/contents/M0201070100.do?showHallId=631120&showroomCode=DM0075
    script_gen_user_content_text: |
      [톤] 말하기 속도를 조금 늦추고 조용하고 차분한 톤.
      [지시사항]
      1. 사진 명소 특성을 강조하되, 공간의 정적과 조명을 묘사해주세요.
      2. 두 사유상의 미세한 분위기 차이를 언급하고, 촬영 시 조용한 매너를 안내해주세요.
      [금지사항]
      - 긴 역사 설명 금지.

  # =======================
  # 8. 외규장각 의궤
  # =======================
  - output_name: "08_uigwe"
    info_retrieval_user_content_text: |
      [조사 주제: 외규장각 의궤]
      외규장각 의궤를 전시한 공간.
      높은 창 구조와 자연광이 어우러져, 오르세 미술관 시계 앞처럼 ‘인증샷 명소’로 자주 언급되는 장소.
      의궤는 왕실 의식·행사 등을 그림과 글로 기록한 조선시대의 중요한 기록 문화재임.
      https://www.museum.go.kr/MUSEUM/contents/M0201050100.do?showHallId=758&showroomCode=DM0028
    script_gen_user_content_text: |
      [톤] 세련된 톤.
      [지시사항]
      1. 사진 명소 특성을 강조해 오르세 시계처럼 인증샷 명소임을 설명해주세요.
      2. 사진 촬영 팁을 제공하고, 의궤의 ‘기록문화재’ 의미를 아주 짧게만 전달해주세요.

  # =======================
  # 9. 도자공예실 — 분청·백자
  # =======================
  - output_name: "09_ceramics_gallery"
    info_retrieval_user_content_text: |
      [조사 주제: 도자공예실]
      국립중앙박물관 2층 도자공예실.
      분청사기·백자 등 다양한 도자 전시.
      부드러운 조명과 색감 덕분에 촬영 명소.
      카메라 휴대폰 촬영 팁.
    script_gen_user_content_text: |
      [톤] 감성적·아늑한 톤.
      [지시사항]
      1. 사진 명소 특성을 강조해 감성적으로 설명해주세요.
      2. 분청은 조금 더 자유롭고 소박한 느낌, 백자는 단정하고 맑은 느낌으로 대비해서 묘사해주세요.
      3. 카메라·휴대폰으로 찍을 때 팁을 넣어주세요.
      4. 학술적인 도자사 해설보다는, “이 공간은 그냥 걸어 다니며 마음에 드는 색과 형태를 골라보는 재미가 있다”는 식으로 가볍게 풀어주세요.

  # =======================
  # 10. 뮤즈(Muse) 굿즈샵
  # =======================
  - output_name: "10_muse_shop"
    info_retrieval_user_content_text: |
      [조사 주제: 굿즈샵 뮤즈]
      국중박 1층 대표 굿즈샵 ‘뮤즈(Muse)’.
      인기 굿즈: 반가사유상 피규어, 전통 문양 노트, 엽서, 키링 등.
      인기 굿즈 검색 및 사람들 리뷰 수집.
      뮤즈 내 사진찍기 좋은 스팟(반가사유상 피규어 앞) 검색.
      https://www.museum.go.kr/MUSEUM/contents/M0201110100.do
    script_gen_user_content_text: |
      [톤] 신나는 톤.
      [지시사항]
      1. “오늘의 추억을 손에 쥐고 나가는 곳”이라는 느낌으로 설명해주세요.
      2. 대표적인 인기 굿즈 예시를 3~5가지 정도 골라, 선물용·본인 소장용으로 어떻게 고르면 좋을지 제안해주세요.
      3. 굿즈와 함께 사진을 찍어 SNS에 올리기 좋은 포인트를 자연스럽게 언급해주세요.
      4. 전시/역사 설명은 하지 않아도 됩니다.

  # =======================
  # 11. 보너스 — 옛 보신각 동종
  # =======================
  - output_name: "11_bosingak_bell"
    info_retrieval_user_content_text: |
      [조사 주제: 옛 보신각 동종]
      국립중앙박물관에 있는 보물 ‘옛 보신각 동종’.
      종로 보신각 터에 설치된 종은 복제품이며, 실제 예전 종로 보신각에서 사용되던 진짜 동종은 국립중앙박물관에 전시됨.
      종 표면에는 문양과 글자가 새겨져 있고, 금속 표면의 녹청과 마모가 세월의 흔적을 보여줌.
      https://www.heritage.go.kr/heri/cul/culSelectDetail.do?pageNo=1_1_2_0&ccbaCpno=1121100020000
    script_gen_user_content_text: |
      [지시사항]
      1. 사진 명소 특성을 강조해 “숨겨진 진짜를 찾아낸 느낌”이 들도록, 복제품이 아닌 진짜 종이라는 포인트를 인상적으로 설명해주세요.
      2. 종 표면의 문양·색·마모된 부분을 시각적으로 묘사해 주세요.
      3. 종 옆에서 비스듬히 찍으면 입체감이 살아난다는 정도의 촬영 팁을 곁들여 주세요.
      4. 기존의 동선에서는 살짝 떨어져서 조금 걸어가야 하는 곳에 위치해 있기 때문에, 관심이 있으신 분들만 방문하라고 안내해주세요.

  # =======================
  # 12. 마무리
  # =======================
  - output_name: "12_closing"
    info_retrieval_user_content_text: |
      [조사 주제: 마무리 멘트]
      국립중앙박물관 필수 스팟 투어를 마무리하는 멘트.
      이 코스에서 둘러본 스팟 목록:
      1) 남산타워 전망
      2) 고구려 강서대묘 사신도
      3) 신라 금관과 금허리띠(국보)
      4) 신라 진흥왕 순수비(국보)
      5) 경천사 십층석탑(국보)
      6) 통일신라 철불
      7) 사유의 방 - 반가사유상(국보)
      8) 외규장각 의궤 전시실
      9) 도자공예실 - 분청·백자
      10) 뮤즈(Muse) 굿즈샵
      보너스) 옛 보신각 동종(보물)

