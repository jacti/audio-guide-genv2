# 단일 파일 테스트용 플레이리스트 설정
# 빠른 테스트나 프로토타이핑에 사용하세요.
#
# 사용법:
#   python -m src.batch_runner --playlist-file playlists/test.yaml

playlist_title: "테스트 샘플 플레이리스트"
description: "단일 파일 테스트용 플레이리스트"
playlist_output_dir_name: "test_sample_playlist"

# 공통 설정
defaults:
  perplexity_model: "sonar-pro" # Perplexity 모델 (정보 검색)
  info_retrieval_prompt_template_name: "universal_retrieval"
  script_gen_prompt_template_name: "unniversal_script_gen"
  script_gen_model: "gpt-5.1" # "gpt-4.1" # "gemini-3-pro-preview"
  voice: "Laomedeia" # "Aoede" # "Leda" "Laomedeia" # Gemini TTS 음성 # Laomedeia # Zephyr # https://docs.cloud.google.com/text-to-speech/docs/gemini-tts?hl=ko#gemini-2-5-pro-tts
  gemini_tts_model: "gemini-2.5-pro-tts" # Gemini TTS 모델
  tts_language: "ko-KR"
  temperature: 0.7

# 테스트할 파일 (필요에 따라 수정하세요)
files:
  - output_name: "test_sample"
    info_retrieval_user_content_text: |
      신라 금관에 대한 상세한 정보를 조사해주세요.
    script_gen_user_content_text: |
      따뜻하고 이야기하듯이 설명해주세요.
