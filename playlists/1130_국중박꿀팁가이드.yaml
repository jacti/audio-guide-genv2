playlist_name: "1130_국중박꿀팁가이드"
description: "방문 전에 알면 훨씬 즐거워지는 국립중앙박물관의 역사, 전시관 구성, 앱 이용법, 시설 및 굿즈샵 정보를 담은 10~15분짜리 오디오 가이드."

metadata:
  author: "Audio Guide Gen"
  version: "1.0"
  tags: ["guide", "museum", "tips", "seoul"]
  created_date: "2025-11-29"

defaults:
  perplexity_model: "sonar-pro"
  info_retrieval_prompt_template_name: "universal_retrieval.yaml"
  script_gen_prompt_template_name: "unniversal_script_gen.yaml"
  voice: "Laomedeia"
  gemini_tts_model: "gemini-2.5-pro-tts"
  script_gen_model: "gpt-5.1"
  tts_language: "ko-KR"
  temperature: 0.7

files:
  # =======================
  # 1. 앱 사용 꿀팁
  # =======================
  - output_name: "01_app_tips"
    info_retrieval_user_content_text: |
      [조사 주제: 가이드 앱]
      국립중앙박물관 관람 가이드 앱 사용법.
      지도 기능, 전시 설명 제공 방식, 음성 가이드 기능 특징 및 장점.
      https://museum-wander.com/ko/
    script_gen_user_content_text: |
      [지시사항]
      1. 음성 가이드, 사진 가이드, 장소 둘러보기 등 유용한 기능과 활용 꿀팁을 전수해주세요.
      2. 앱을 통해 넓은 박물관을 헤매지 않고 효율적으로 관람할 수 있음을 강조하세요.
      3. (주의) '공식 앱'이라는 표현은 절대 사용하지 마세요.

  # =======================
  # 2. 박물관 소개
  # =======================
  - output_name: "02_museum_intro"
    info_retrieval_user_content_text: |
      [조사 주제: 국립중앙박물관 소개]
      국립중앙박물관의 역사, 설립 배경, 이전 과정(2005년 용산 이전).
      위치(서울 용산구 서빙고로 137), 규모, 국가중앙박물관으로서의 역할.
      https://www.museum.go.kr
    script_gen_user_content_text: |
      [역할] 친절한 가이드
      [지시사항]
      1. 국립중앙박물관의 역사와 설립 배경, 그리고 용산으로의 이전 과정을 간략히 설명하세요.
      2. 대한민국을 대표하는 국가중앙박물관으로서의 위상과 역할을 강조하세요.
      3. (주의) 전시관 구성이나 관람 동선은 다음 트랙에서 다루므로 언급하지 마세요.

  # =======================
  # 3. 방문 팁
  # =======================
  - output_name: "03_visit_tips"
    info_retrieval_user_content_text: |
      [조사 주제: 방문 및 운영 정보]
      국립중앙박물관 운영시간, 휴관일, 야간개장 정보(수/토 21:00까지), 방문하기 좋은 시간대.
      대중교통(이촌역 연결), 주차 정보, 혼잡시간 회피 팁.
      https://www.museum.go.kr/site/main/content/open_time
    script_gen_user_content_text: |
      [지시사항]
      1. 언제 방문하면 가장 좋은지 운영 시간과 야간 개장 정보를 알려주세요.
      2. 대중교통 이용 팁(이촌역 무빙워크 등)과 주차, 혼잡 시간을 피하는 요령을 안내하세요.
      3. 시설 상세 안내는 제외하고, 시간과 이동 정보에 집중하세요.

  # =======================
  # 4. 전시관 소개
  # =======================
  - output_name: "04_exhibition_hall_overview"
    info_retrieval_user_content_text: |
      [조사 주제: 전시관 전체 구성]
      국립중앙박물관 전시관 전체 구성 설명.
      주요 전시관과 관련 공식 링크:
      - 선사·고대관: https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?showHallId=760
      - 중·근세관: https://www.museum.go.kr/MUSEUM/contents/M0201040100.do?showHallId=759
      - 서화관: https://www.museum.go.kr/MUSEUM/contents/M0201050100.do?showHallId=758
      - 기증관: https://www.museum.go.kr/MUSEUM/contents/M0201060100.do?showHallId=755
      - 사유의 방: https://www.museum.go.kr/MUSEUM/contents/M0201070100.do?showHallId=631120
      - 조각·공예관, 세계문화관, 역사의 길, 야외 전시 등.
    script_gen_user_content_text: |
      [지시사항]
      1. 박물관의 전체적인 전시관 구조와 각 전시 공간의 성격을 개괄적으로 소개하세요.
      2. 선사·고대관부터 사유의 방, 야외 전시까지 다채로운 볼거리가 있음을 알려주세요.
      3. (주의) 역사나 설립 배경, 운영 정보는 제외하고 공간 구성에만 집중하세요.

  # =======================
  # 5. 시설 안내
  # =======================
  - output_name: "05_facilities"
    info_retrieval_user_content_text: |
      [조사 주제: 편의시설 안내]
      국립중앙박물관 편의시설 위치 및 이용법.
      물품보관함, 유아차 대여, 카페, 푸드코트, 기념촬영 포인트, 장애인 편의시설 등.
      https://www.museum.go.kr/site/main/content/facility
    script_gen_user_content_text: |
      [지시사항]
      1. 무거운 짐을 맡길 곳, 식사할 곳, 휴식할 곳 등 편의 시설 정보를 상세히 안내하세요.
      2. 관람객이 쾌적하게 박물관을 이용할 수 있도록 실질적인 도움을 주는 정보를 전달하세요.
      3. 운영시간이나 전시관 구성 내용은 반복하지 마세요.

  # =======================
  # 6. 굿즈샵 뮤즈
  # =======================
  - output_name: "06_goods_shop_muse"
    info_retrieval_user_content_text: |
      [조사 주제: 굿즈샵 뮤즈]
      국립중앙박물관 1층 대표 굿즈샵 ‘뮤즈(Muse)’ 소개.
      인기 굿즈: 반가사유상 피규어, 전통문양 스테이셔너리, 엽서·키링·북마크 등.
      https://www.museum.go.kr/MUSEUM/contents/M0201110100.do
    script_gen_user_content_text: |
      [지시사항]
      1. 관람의 마무리를 장식할 굿즈샵 '뮤즈'를 소개하세요.
      2. 반가사유상 피규어 등 소장 욕구를 자극하는 인기 아이템들을 추천하며 방문을 유도하세요.
