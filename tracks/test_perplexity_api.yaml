track_name: "Perplexity API 테스트"
description: "신라 금관 금허리띠 정보 검색 테스트"

defaults:
  model: "gpt-4.1"
  info_prompt_version: "default"
  script_prompt_version: "v2-tts"
  voice: "Zephyr"
  temperature: 0.7
  max_retries: 8
  dry_run: false
  max_queries: 5  # 쿼리 개수 제한

files:
  - output_name: "04_신라금관허리띠"
    search_keyword: "신라 금관 금허리띠"
    info_prompt: |
      신라 왕실의 금관과 금허리띠에 대한 정보를 수집해주세요.

      중점 검색 내용:
      - 국보 지정 정보 및 유물 설명
      - 왕권 상징으로서의 의미와 역사적 배경
      - 경주 APEC 정상회의에서 트럼프 대통령에게 선물한 일화
      - 금관과 금허리띠의 예술적 특징 (황금빛, 섬세한 장식 등)
      - 국립중앙박물관 전시 정보

      참고 링크: https://www.museum.go.kr/MUSEUM/contents/M0201030800.do?schM=view&showHallId=760&relicId=85
    max_queries: 7  # 복잡한 주제이므로 더 많은 쿼리 허용
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      고급스럽고 흥미로운 스토리 중심.
      - 유물 앞에 섰을 때 보이는 황금빛, 섬세한 장식, 머릿속에 '왕'이 떠오르는 느낌을 중심으로 설명해주세요.
      - APEC·트럼프 이야기 가볍게 삽입
