track_name: "국립중앙박물관 필수 스팟 가이드"
description: "국중박에서 꼭 들러야 하는 필수 스팟만 모은 핵심 투어 가이드 (사진 명소 + 국보/보물 포함)"

defaults:
  model: "gpt-4.1"
  script_prompt_version: "v4-tts"
  voice: "Zephyr"
  tts_model: "gemini-2.5-flash-tts"
  temperature: 0.75
  max_retries: 2

metadata:
  author: "국립중앙박물관"
  version: "1.1"
  created_date: "2025-11-19"


files:
  # --------------------------------------------------------
  # 0. 가이드 소개 — 스팟 전체 목록을 search_keyword에 명시
  # --------------------------------------------------------
  - output_name: "00_가이드소개"
    search_keyword: |
      국립중앙박물관 필수 스팟 가이드 소개.
      전체 전시를 다 보지 못해도 핵심만 볼 수 있도록 구성된 큐레이션 코스.
      이 가이드에서 다루는 스팟 목록은 아래와 같음:

      1) 국중박 입구 남산타워 전망  
      2) 경천사 십층석탑(국보)  
      3) 고구려 강서대묘 사신도  
      4) 신라 금관과 금허리띠(국보)  
      5) 신라 진흥왕 순수비(국보)  
      6) 통일신라 철불  
      7) 사유의 방 - 반가사유상(국보)  
      8) 외규장각 의궤 전시실  
      9) 도자공예실 - 분청사기·백자  
      10) 뮤즈(Muse) 굿즈샵  
      보너스: 옛 보신각 동종(보물)

      각 스팟은 사진 명소 또는 국보·보물급 주요 유물임.
      이 코스는 짧은 시간 안에 “국중박의 하이라이트”를 체험할 수 있도록 설계됨.
    script_gen_prompt: |
      톤: 밝고 힘찬 여행 시작 톤.
      구성:
        - search_keyword에 제공된 스팟 목록을 기반으로, “이런 명소들을 앞으로 함께 보게 된다”는 예고 멘트를 만들어주세요.
        - 스팟 하나하나의 상세 설명은 하지 말고, 전체 코스의 분위기와 기대감을 중심으로 설명해주세요.
        - “핵심만 쏙 골라보는 알짜배기 투어”라는 느낌을 강조해주세요.
        - 제공된 모든 스팟을 전부 나열할 필요는 없습니다.
      금지:
        - 스팟별 역사적 상세 묘사 금지.


  # --------------------------------------------------------
  # 1. 남산타워 전망
  # --------------------------------------------------------
  - output_name: "01_남산타워전망"
    search_keyword: |
      국립중앙박물관 입구에서 남산타워가 잘 보이는 전망 포인트.
      사진 명소로 유명함.
      어느시간대가 아름다운지 검색.
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      - “여행의 시작을 알리는 첫 사진 스팟”이라는 느낌으로 설명해주세요.
      - 남산타워와 박물관을 함께 담는 구도, 추천 시간대(특히 노을 무렵)를 말해 주세요.
      - 박물관에 들어가기 전 가벼운 설렘을 느끼도록 분위기를 살려주세요.
      - 점프 샷 등 다양한 포즈 추천
      - 박물관 역사·유물 이야기는 하지 마세요.


  # --------------------------------------------------------
  # 2. 경천사 십층석탑
  # --------------------------------------------------------
  - output_name: "02_경천사십층석탑"
    search_keyword: |
      고려 말 제작된 경천사 십층석탑.
      국보임.
      국립중앙박물관 1층 중앙홀에 위치.
      공식 링크: https://www.museum.go.kr/MUSEUM/contents/M0201101000.do?schM=view&showHallId=406012&relicId=17738
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      분위기: 웅장·압도적.
      - 1층 중앙홀에 들어섰을 때 시야를 가득 채우는 ‘압도감’을 중심으로 설명해주세요.
      - 층층이 쌓인 조각 디테일을 따라 위로 올려다보는 경험을 묘사해주세요.
      - 사진 촬영 시 추천 거리·각도 제시


  # --------------------------------------------------------
  # 3. 강서대묘 사신도
  # --------------------------------------------------------
  - output_name: "03_강서대묘사신도"
    search_keyword: |
      고구려 고분벽화 강서대묘의 사신도.
      사신: 청룡·백호·주작·현무.
      벽화가 가진 동적 표현.
      출처: https://ko.wikipedia.org/wiki/강서대묘
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      생생한 시각적 묘사 중심.
      - 네 사신을 시각적으로 떠올릴 수 있게 묘사
      - 고구려 벽화의 역동성 전달


  # --------------------------------------------------------
  # 4. 신라 금관과 허리띠
  # --------------------------------------------------------
  - output_name: "04_신라금관허리띠"
    search_keyword: |
      신라 왕실의 금관·금허리띠.
      국보.
      왕권 상징.
      경주 APEC 정상회의에서 트럼프 대통령에게 선물한 일화 검색.
      전시 링크: https://www.museum.go.kr/MUSEUM/contents/M0201030800.do?schM=view&showHallId=760&relicId=85
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      고급스럽고 흥미로운 스토리 중심.
       - 유물 앞에 섰을 때 보이는 황금빛, 섬세한 장식, 머릿속에 ‘왕’이 떠오르는 느낌을 중심으로 설명해주세요.
      - APEC·트럼프 이야기 가볍게 삽입


  # --------------------------------------------------------
  # 5. 신라 진흥왕 순수비
  # --------------------------------------------------------
  - output_name: "05_신라진흥왕순수비"
    search_keyword: |
      신라 진흥왕 순수비.
      국보.
      진흥왕의 순수·영토 확장과 관련됨.
      비석의 고대 한글 아닌 한자 비문 특징.
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      무게감 있는 톤.
      - 순수비가 무엇인지 간결하게 설명
      - 돌비석 앞에서 옛 사람들의 글씨를 들여다보는 장면을 상상하며 설명해주세요.
      - “어디까지가 우리 땅인지 흔적을 남기고 싶었던 왕의 마음” 같은 식으로, 영토 확장의 상징성을 짧게 언급해주세요.
      - 역사 전체를 강의하듯 길게 설명하지 말고, 비석이라는 물건 자체가 주는 현장감에 집중해주세요.




  # --------------------------------------------------------
  # 6. 통일신라 철불
  # --------------------------------------------------------
  - output_name: "06_통일신라철불"
    search_keyword: |
      국중박 1층의 대형 통일신라 철불.
      거대한 크기, 금속 주조 불상.
      사진 명소.
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      웅장하고 느긋한 톤.
      - 실제 크기의 압도감 묘사
      - 금속 질감·빛 반사 묘사
      - 추천 촬영 각도


  # --------------------------------------------------------
  # 7. 사유의 방 — 반가사유상
  # --------------------------------------------------------
  - output_name: "07_사유의방"
    search_keyword: |
      사유의 방 전시실.
      국보 반가사유상 두 점.
      어둡고 명상적 분위기와 조명 연출.
      링크: https://www.museum.go.kr/MUSEUM/contents/M0201070100.do?showHallId=631120&showroomCode=DM0075
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      말하기 속도를 조금 늦추고 조용하고 차분한 톤.
      - 공간의 정적·조명 묘사
      - 두 사유상의 미세한 분위기 차이 언급
      - 촬영 시 조용한 매너 안내
      금지: 긴 역사 설명.


  # --------------------------------------------------------
  # 8. 외규장각 의궤
  # --------------------------------------------------------
  - output_name: "08_외규장각의궤"
    search_keyword: |
      외규장각 의궤를 전시한 공간.
      높은 창 구조와 자연광이 어우러져,
      오르세 미술관 시계 앞처럼 ‘인증샷 명소’로 자주 언급되는 장소.
      의궤는 왕실 의식·행사 등을 그림과 글로 기록한 조선시대의 중요한 기록 문화재임.
      링크: https://www.museum.go.kr/MUSEUM/contents/M0201050100.do?showHallId=758&showroomCode=DM0028
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      세련된 톤.
      - 오르세 시계처럼 사진 명소임을 강조
      - 사진 촬영 팁
      - 의궤의 ‘기록문화재’ 의미를 아주 짧게만 전달


  # --------------------------------------------------------
  # 9. 도자공예실 — 분청·백자
  # --------------------------------------------------------
  - output_name: "09_도자공예"
    search_keyword: |
      국립중앙박물관 2층 도자공예실.
      분청사기·백자 등 다양한 도자 전시.
      부드러운 조명과 색감 덕분에 촬영 명소.
      카메라 휴대폰 촬영 팁.
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      감성적·아늑한 톤.
      - 분청은 조금 더 자유롭고 소박한 느낌, 백자는 단정하고 맑은 느낌으로 대비해서 묘사해주세요.
      - 카메라·휴대폰으로 찍을 때 팁을 넣어주세요.
      - 학술적인 도자사 해설보다는, “이 공간은 그냥 걸어 다니며 마음에 드는 색과 형태를 골라보는 재미가 있다”는 식으로 가볍게 풀어주세요.




  # --------------------------------------------------------
  # 10. 뮤즈(Muse) 굿즈샵
  # --------------------------------------------------------
  - output_name: "10_뮤즈"
    search_keyword: |
      국중박 1층 대표 굿즈샵 ‘뮤즈(Muse)’.
      인기 굿즈: 반가사유상 피규어, 전통 문양 노트, 엽서, 키링 등.
      인기 굿즈를 검색해서 명시할 것. 특히 사람들의 리뷰를 같이 수집할 것.
      뮤즈 내 사진찍기 좋은 스팟(반가사유상 피규어 앞) 등을 검색해서 수집할 것.
      링크: https://www.museum.go.kr/MUSEUM/contents/M0201110100.do
    script_gen_prompt: |
      신나는 톤
      - “오늘의 추억을 손에 쥐고 나가는 곳”이라는 느낌으로 설명해주세요.
      - 대표적인 인기 굿즈 예시를 3~5가지 정도 골라,
        선물용·본인 소장용으로 어떻게 고르면 좋을지 제안해주세요.
      - 굿즈와 함께 사진을 찍어 SNS에 올리기 좋은 포인트를 자연스럽게 언급해주세요.
      - 전시/역사 설명은 하지 않아도 됩니다.


  # --------------------------------------------------------
  # 11. 보너스 — 옛 보신각 동종
  # --------------------------------------------------------
  - output_name: "11_보신각동종"
    search_keyword: |
      국립중앙박물관에 있는 보물 ‘옛 보신각 동종’.
      종로 보신각 터에 설치된 종은 복제품이며,
      실제 예전 종로 보신각에서 사용되던 진짜 동종은 국립중앙박물관에 전시됨.
      종 표면에는 문양과 글자가 새겨져 있고,
      금속 표면의 녹청과 마모가 세월의 흔적을 보여줌.
      문화재청 정보:
      https://www.heritage.go.kr/heri/cul/culSelectDetail.do?pageNo=1_1_2_0&ccbaCpno=1121100020000
    script_gen_prompt: |
      사진 명소 특성을 강조해 묘사해주세요.
      - “숨겨진 진짜를 찾아낸 느낌”이 들도록, 복제품이 아닌 진짜 종이라는 포인트를 인상적으로 설명해주세요.
      - 종 표면의 문양·색·마모된 부분을 시각적으로 묘사해 주세요.
      - 종 옆에서 비스듬히 찍으면 입체감이 살아난다는 정도의 촬영 팁을 곁들여 주세요.


  # --------------------------------------------------------
  # 12. 마무리
  # --------------------------------------------------------
  - output_name: "12_마무리"
    search_keyword: |
      국립중앙박물관 필수 스팟 투어를 마무리하는 마무리 멘트.
      이 코스에서 둘러본 스팟 목록:

      1) 남산타워 전망  
      2) 경천사 십층석탑(국보)  
      3) 강서대묘 사신도  
      4) 신라 금관과 금허리띠(국보)  
      5) 신라 진흥왕 순수비(국보)  
      6) 통일신라 철불  
      7) 사유의 방 - 반가사유상(국보)  
      8) 외규장각 의궤 전시실  
      9) 도자공예실 - 분청·백자  
      10) 뮤즈(Muse) 굿즈샵  
      보너스) 옛 보신각 동종(보물)

      관람객이 사진 명소와 국보·보물을 중심으로
      짧은 시간 안에 국중박의 하이라이트를 경험했다는 점을 상기시키기.
      다음 방문 때 천천히 더 보고 싶을 스팟으로는
      예를 들어 사유의 방, 도자공예실처럼 오래 머물기 좋은 공간들을 추천할 수 있음.
      다음 코스로는 현재 사용 중인 '뮤지엄 원더' 앱에 있는 또다른 가이드 ‘국립중앙박물관 한국사 완전정복 가이드’나
      야외 정원·야외전시를 가볍게 이어서 관람하는 코스를 제안할 수 있음.
    script_gen_prompt: |
      - 따뜻하고 잔잔한 톤으로, 오늘 함께 걸어온 코스를 되짚어 주세요.
      - search_keyword에 있는 스팟 목록을 활용해,
        “오늘은 이런 곳들을 함께 돌아봤다”는 느낌으로 핵심만 짧게 요약해주세요.
      - 다시 오면 천천히 둘러보면 좋을 스팟(예: 사유의 방, 도자공예실)을 1~2곳 정도 추천해 주세요.
      - search_keyword에 언급된 다음 추천 코스(한국사 완전정복 가이드 듣기 또는 야외 정원 야외 전시 관람)을 자연스럽게 제안하며 마무리해주세요.
      - 새로운 스팟을 추가로 만들지 말고, search_keyword에 명시된 정보 안에서만 구성해 주세요.
