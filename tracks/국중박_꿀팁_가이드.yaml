track_name: "국립중앙박물관 방문 전 꿀팁 가이드"
description: "방문 전에 알면 훨씬 즐거워지는 국립중앙박물관의 역사, 전시관 구성, 앱 이용법, 시설 및 굿즈샵 정보를 담은 10~15분짜리 오디오 가이드."

defaults:
  model: "gpt-4.1"
  script_prompt_version: "v3-tts"
  voice: "Laomedeia"
  temperature: 0.7
  dry_run: false

files:
  # --------------------------------------
  # 1. 박물관 소개 — 링크 정리 완료
  # --------------------------------------
  - output_name: "1_박물관소개"
    search_keyword: |
      국립중앙박물관의 역사, 설립 배경, 이전 과정(2005년 용산 이전), 위치(서울 용산구 서빙고로 137), 규모, 국가중앙박물관으로서의 역할을 설명해주세요.
      참고: 국립중앙박물관 메인 페이지 https://www.museum.go.kr
    script_gen_prompt: |
      전시관 구성이나 관람 동선 소개는 하지 마세요.
      "박물관의 역사, 설립 과정, 위치, 국가대표 기관으로서의 역할"만 담아주세요.
      전시관 상세 설명은 다음 트랙에서 진행하므로 반복하지 마세요.

  # --------------------------------------
  # 2. 전시관 소개 — 모든 전시관 링크 추가
  # --------------------------------------
  - output_name: "2_전시관소개"
    search_keyword: |
      국립중앙박물관 전시관 전체 구성을 설명해주세요.
      주요 전시관과 관련 공식 링크는 아래 내용을 참고하세요.

      - 선사·고대관: https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?showHallId=760
      - 중·근세관: https://www.museum.go.kr/MUSEUM/contents/M0201040100.do?showHallId=759
      - 서화관: https://www.museum.go.kr/MUSEUM/contents/M0201050100.do?showHallId=758
      - 기증관: https://www.museum.go.kr/MUSEUM/contents/M0201060100.do?showHallId=755
      - 사유의 방: https://www.museum.go.kr/MUSEUM/contents/M0201070100.do?showHallId=631120
      - 조각·공예관, 세계문화관, 역사의 길, 야외 전시 등도 포함해주세요.

    script_gen_prompt: |
      이 트랙은 "전시관 구조와 각 전시 공간의 역할"에만 집중해주세요.
      박물관의 역사, 설립 배경, 운영시간, 시설 안내 등은 포함하지 마세요.

  # --------------------------------------
  # 3. 앱 사용 꿀팁 — 앱 링크만 유지
  # --------------------------------------
  - output_name: "3_앱사용꿀팁"
    search_keyword: |
      국립중앙박물관 공식 관람 앱 `Museum Wander` 사용법 소개.
      지도 기능, 전시 설명 제공 방식, 음성 가이드 기능 등을 중심으로 리뷰해주세요.
      앱 안내: https://museum-wander.com/ko/
    script_gen_prompt: |
      앱 기능, 장점, 활용법에 집중해주세요.
      전시관 구성, 운영시간, 시설 안내 등은 이 트랙에서 제외합니다.

  # --------------------------------------
  # 4. 방문 팁 — 운영시간 페이지 링크만 유지
  # --------------------------------------
  - output_name: "4_방문팁"
    search_keyword: |
      국립중앙박물관 운영시간, 휴관일, 야간개장 정보(수/토 21:00까지), 방문하기 좋은 시간대 안내.
      대중교통(이촌역 연결), 주차 정보, 혼잡시간 회피 팁 등을 포함해주세요.
      운영시간 안내: https://www.museum.go.kr/site/main/content/open_time
    script_gen_prompt: |
      시간·운영·혼잡도·교통 정보를 중심으로 설명해주세요.
      시설 상세 안내는 제외하고, 필요한 경우 최소한으로만 언급하세요.

  # --------------------------------------
  # 5. 시설 안내 — 시설 관련 링크 추가
  # --------------------------------------
  - output_name: "5_시설안내"
    search_keyword: |
      국립중앙박물관 편의시설(물품보관함, 유아차 대여, 카페, 푸드코트, 기념촬영 포인트, 장애인 편의시설)의 위치와 이용법 소개.
      국립중앙박물관 시설 안내 페이지 참고: https://www.museum.go.kr/site/main/content/facility
    script_gen_prompt: |
      편의시설 안내에만 집중해주세요.
      운영시간, 방문시간 추천, 앱 정보, 전시관 구성은 반복하지 마세요.

  # --------------------------------------
  # 6. 굿즈샵 뮤즈 — 굿즈샵 링크 유지
  # --------------------------------------
  - output_name: "6_굿즈샵뮤즈"
    search_keyword: |
      국립중앙박물관 1층 대표 굿즈샵 ‘뮤즈(Muse)’ 소개.
      인기 굿즈(반가사유상 피규어, 전통문양 스테이셔너리, 엽서·키링·북마크 등) 정보를 포함해주세요.
      굿즈샵 안내: https://www.museum.go.kr/MUSEUM/contents/M0201110100.do
    # 이 트랙은 중복 우려가 없어 script_gen_prompt 없음
