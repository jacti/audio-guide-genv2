track_name: "국립중앙박물관 한국사 완전정복"
description: "국립중앙박물관 선사·고대관부터 중·근세관까지 이어지는 2~3시간 완전 본편 오디오 가이드"

metadata:
  author: "국립중앙박물관"
  version: "1.0"
  tags: ["history", "korea", "museum", "guide"]
  created_date: "2025-11-07"

defaults:
  model: "gpt-4.1"
  info_prompt_version: "default"
  script_prompt_version: "v3-tts"
  voice: "Laomedeia"
  tts_model: "gemini-2.5-flash-tts"
  temperature: 0.7
  max_retries: 8
  dry_run: false

files:
  # =======================
  # 0. 테마 소개
  # =======================
  - output_name: "00_테마소개"
    search_keyword: |
      국립중앙박물관에서 선사시대부터 조선 후기까지의 주요 유물을 따라가는 ‘한국사 완전정복’ 테마를 설명해주세요.
      이 가이드는 선사·고대관에서 중·근세관까지 이어지며, “유물로 배우는 한국사”라는 콘셉트입니다.
      우리가 들를 구역과 대표 유물들을 요약해 소개하고, 한국사를 제대로 느끼려는 관람객에게 인사말과 기대감을 전달해주세요.

  # =======================
  # 1. 전시관 소개 — 선사·고대관
  # =======================
  - output_name: "01_전시관_선사고대관"
    search_keyword: |
      선사·고대관 전체 설명.
      구석기~신석기~청동기~철기~고조선~삼한~고구려~백제~신라~가야~통일신라·발해까지 이어지는 한국사의 큰 흐름을 소개해주세요.
      https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?showHallId=760&showroomCode=DM0002

  # =======================
  # 2. 구석기
  # =======================
  - output_name: "02_구석기_주먹도끼"
    search_keyword: |
      국립중앙박물관 구석기실의 주먹도끼 설명.
      용도, 제작법, 인류사적 의미를 중심으로 해설해주세요.
      https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?schM=view&showHallId=760&relicId=29836

  - output_name: "03_구석기_고인류"
    search_keyword: |
      한반도 고인류 화석 전시 설명.
      발견 배경과 의미 중심 해설.
      https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?schM=view&showHallId=760&relicId=29840

  # =======================
  # 3. 신석기
  # =======================
  - output_name: "04_신석기_뼈바늘_가락바퀴"
    search_keyword: |
      신석기 시대의 뼈바늘과 가락바퀴가 보여주는 의복 문화·생활 기술 발전 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29855

  - output_name: "05_신석기_고산리식토기"
    search_keyword: |
      고산리식 토기의 특징과 신석기 토기 기술의 변화 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29856

  - output_name: "06_신석기_부산가덕도인골"
    search_keyword: |
      부산 가덕도 신석기 인골의 학술적 의미와 당시 생활상 해설.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29880

  # =======================
  # 4. 청동기
  # =======================
  - output_name: "07_청동기_민무늬토기"
    search_keyword: |
      민무늬토기의 특징과 청동기 시대 생활 변화 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29880

  - output_name: "08_청동기_농경문청동기"
    search_keyword: |
      농경문 청동기가 담고 있는 농경 의례·사회 구조 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030300.do?schM=view&showHallId=760&relicId=10997

  # =======================
  # 5. 고조선·부여·삼한
  # =======================
  - output_name: "09_고조선_비파형동검"
    search_keyword: |
      비파형 동검의 형태·권력 상징·동북아 교류 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030400.do?schM=view&showHallId=760&relicId=29833

  - output_name: "10_고조선_통나무관"
    search_keyword: |
      통나무 관 매장 문화 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030400.do?schM=view&showHallId=760&relicId=29934

  # =======================
  # 6. 고구려
  # =======================
  - output_name: "11_고구려_금동관"
    search_keyword: |
      고구려 금동관의 장식·권력 상징·예술성 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=28

  - output_name: "12_고구려_짐승무늬수막새"
    search_keyword: |
      수막새의 용도와 건축 장식, 고구려 미술 특징 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=43

  - output_name: "13_고구려_광개토대왕릉비탁본"
    search_keyword: |
      광개토대왕릉비 원석탁본 설명.
      비문 내용 요약과 역사적 의미 포함.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=29932

  - output_name: "14_고구려_비늘갑옷"
    search_keyword: |
      고구려 비늘갑옷의 구조·전쟁 문화·군사 기술 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=29925

  - output_name: "15_고구려_연가7년불상"
    search_keyword: |
      연가 7년에 만들어진 불상의 의의·양식 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=29926

  # =======================
  # 7. 백제
  # =======================
  - output_name: "16_백제_치미"
    search_keyword: |
      백제 치미의 크기·용도·건축미 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030600.do?schM=view&showHallId=760&relicId=26998

  - output_name: "17_백제_관꾸미개"
    search_keyword: |
      백제 왕비 장신구 관꾸미개의 예술성·신분 상징 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030600.do?schM=view&showHallId=760&relicId=26992

  - output_name: "18_백제_금동대향로"
    search_keyword: |
      금동대향로의 구조·예술성·종교적 의미 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030600.do?schM=view&showHallId=760&relicId=27092

  # =======================
  # 8. 가야
  # =======================
  - output_name: "19_가야_미늘쇠"
    search_keyword: |
      가야 무기 문화와 미늘쇠의 구조적 특징 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030700.do?schM=view&showHallId=760&relicId=27008

  - output_name: "20_가야_투구와판갑옷"
    search_keyword: |
      가야 철갑옷의 제작 기술과 군사 문화 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030700.do?schM=view&showHallId=760&relicId=27007

  # =======================
  # 9. 신라
  # =======================
  - output_name: "21_신라_금관과금허리띠"
    search_keyword: |
      신라 금관·금허리띠의 상징성, 장례 문화, APEC 사례 포함.
      https://www.museum.go.kr/MUSEUM/contents/M0201030800.do?schM=view&showHallId=760&relicId=85

  - output_name: "22_신라_봉황머리유리병"
    search_keyword: |
      봉황머리 모양 유리병의 제작 기술·무역 배경 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030800.do?schM=view&showHallId=760&relicId=88

  # =======================
  # 10. 통일신라
  # =======================
  - output_name: "23_통일신라_사천왕전"
    search_keyword: |
      사천왕전의 의미와 신앙·예술적 특징 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030900.do?schM=view&showHallId=760&relicId=16550

  - output_name: "24_통일신라_팔부중"
    search_keyword: |
      팔부중의 조형과 불교 수호신 신앙 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201030900.do?schM=view&showHallId=760&relicId=15983

  # =======================
  # 11. 발해
  # =======================
  - output_name: "25_발해_두부처"
    search_keyword: |
      발해 불상의 양식과 당시 불교 문화 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201031000.do?schM=view&showHallId=760&relicId=747

  # =======================
  # 12. 전시관 소개 — 중·근세관
  # =======================
  - output_name: "26_전시관_중근세관"
    search_keyword: |
      고려~조선~대한제국을 포함하는 중·근세관의 전체 구조와 관람 포인트 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040100.do?showHallId=759&showroomCode=DM0036

  # =======================
  # 13. 고려
  # =======================
  - output_name: "27_고려_인종시호"
    search_keyword: |
      인종의 시호를 올린 글의 역사적 배경과 의미 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040100.do?schM=view&showHallId=759&relicId=16644

  - output_name: "28_고려_청자배모양그릇"
    search_keyword: |
      청자 배모양 그릇(왕의 변기)의 용도와 유머러스한 비하인드 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040100.do?schM=view&showHallId=759&relicId=29428

  - output_name: "29_고려_수령옹주묘지명"
    search_keyword: |
      수령옹주의 비극적인 생애와 묘지명의 감동적 해설.
      https://www.museum.go.kr/MUSEUM/contents/M0201040200.do?schM=view&showHallId=759&relicId=17004

  - output_name: "30_고려_초조대장경"
    search_keyword: |
      초조대장경의 기술적 의미·고려 불교문화·대장경의 역할 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040200.do?schM=view&showHallId=759&relicId=29645

  - output_name: "31_고려_앉아있는보살상"
    search_keyword: |
      고려 불교의 특징과 보살상의 조형적 아름다움 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040200.do?schM=view&showHallId=759&relicId=29429

  - output_name: "32_고려_정몽주초상"
    search_keyword: |
      고려 왕조 마지막 충신 정몽주의 생애·상징성·역사적 의미 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040200.do?schM=view&showHallId=759&relicId=17014

  # =======================
  # 14. 조선
  # =======================
  - output_name: "33_조선_태조어진"
    search_keyword: |
      태조 이성계의 어진 해설.
      조선 왕조 정통성과 권위 상징 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040300.do?schM=view&showHallId=759&relicId=16222

  - output_name: "34_조선_근정전어좌"
    search_keyword: |
      근정전 어좌 복제품의 역할, 왕의 권위, 조선 궁궐 문화 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040300.do?schM=view&showHallId=759&relicId=16224

  - output_name: "35_조선_천상열차분야지도"
    search_keyword: |
      천상열차분야지도의 과학기술·천문 관측·역사적 역할 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040300.do?schM=view&showHallId=759&relicId=17717

  - output_name: "36_조선_용비어천가"
    search_keyword: |
      용비어천가의 역사적 배경과 조선 건국 이념 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040400.do?schM=view&showHallId=759&relicId=750

  - output_name: "37_조선_측우기"
    search_keyword: |
      조선의 과학 기술을 대표하는 측우기의 구조·역사적 역할 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040400.do?schM=view&showHallId=759&relicId=757

  - output_name: "38_조선_달항아리"
    search_keyword: |
      달항아리의 미학·제작법·왜 현대인이 좋아하는지 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040400.do?schM=view&showHallId=759&relicId=27894

  - output_name: "39_조선_동의보감"
    search_keyword: |
      동의보감의 구성·의학사적 가치·허준 이야기 해설.
      https://www.museum.go.kr/MUSEUM/contents/M0201040500.do?schM=view&showHallId=759&relicId=16216

  - output_name: "40_조선_화성성역의궤"
    search_keyword: |
      화성성역의궤의 건축 기록·정조의 개혁 의지·문화재적 가치 설명.
      https://www.museum.go.kr/MUSEUM/contents/M0201040500.do?schM=view&showHallId=759&relicId=12798

  - output_name: "41_조선_대동여지도"
    search_keyword: |
      김정호의 지도 제작 기술·측량법·대동여지도의 혁신적 구조 설명.
      영화 ‘고산자, 대동여지도’ 언급 포함.
      https://www.museum.go.kr/MUSEUM/contents/M0201040500.do?schM=view&showHallId=759&relicId=700

  # =======================
  # 15. 마무리
  # =======================
  - output_name: "42_마무리"
    search_keyword: |
      오늘 진행한 한국사 역사여행을 마무리하며 느낄 점을 정리하고 관람객에게 감사 인사와 다음 관람 추천까지 포함해주세요.
