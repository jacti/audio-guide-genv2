track_name: "국립중앙박물관 한국사 완전정복"
description: "국립중앙박물관 선사·고대관부터 중·근세관까지 이어지는 2~3시간 완전 본편 오디오 가이드"

metadata:
  author: "국립중앙박물관"
  version: "1.1"
  tags: ["history", "korea", "museum", "guide", "audio_tour"]
  created_date: "2025-11-24"

defaults:
  model: "gpt-4o" # 최신 모델 권장
  info_prompt_version: "default"
  script_prompt_version: "v3-tts-storytelling"
  voice: "Laomedeia"
  tts_model: "gemini-2.5-pro-tts"
  tts_language: "ko-KR"
  temperature: 0.7
  max_retries: 8
  dry_run: false

files:
  # =======================
  # 0. 테마 소개
  # =======================
  - output_name: "00_테마소개"
    search_keyword: |
      국립중앙박물관 상설전시관 '선사·고대관' 및 '중·근세관' 관람 코스 특징.
      "유물로 배우는 한국사" 컨셉.
      구석기부터 조선 후기까지의 역사 흐름 요약.
      관람 소요 시간(2~3시간) 및 주요 관전 포인트.
    script_gen_prompt: |
      [역할] 당신은 국립중앙박물관의 베테랑 도슨트입니다.
      [상황] 관람객이 투어를 시작하기 전, 이어폰을 꽂고 첫 트랙을 재생했습니다.
      [지시사항]
      1. 검색된 정보를 바탕으로 환영 인사를 건네고, 이번 투어의 컨셉("유물로 떠나는 한국사 시간여행")을 매력적으로 소개하세요.
      2. 선사시대부터 조선시대까지의 긴 여정이지만, 핵심 유물만 쏙쏙 골라 지루하지 않게 안내하겠다는 기대감을 심어주세요.
      3. 톤앤매너: 활기차고 신뢰감 있는 목소리, 구어체(해요체).

  # =======================
  # 1. 전시관 소개 — 선사·고대관
  # =======================
  - output_name: "01_전시관_선사고대관"
    search_keyword: |
      국립중앙박물관 선사·고대관 전시실 구성 및 순서.
      구석기, 신석기, 청동기, 고조선, 삼한, 고구려, 백제, 신라, 가야, 통일신라, 발해의 역사적 흐름.
      인류의 시작부터 고대 국가의 완성까지의 서사.
      https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?showHallId=760&showroomCode=DM0002
    script_gen_prompt: |
      [역할] 전문 도슨트
      [지시사항]
      1. 이제 본격적으로 1층 '선사·고대관'으로 입장함을 알리세요.
      2. 이곳이 단순한 유물의 나열이 아니라, 한반도에서 사람이 살기 시작한 순간부터 고대 국가들이 찬란한 문화를 꽃피우기까지의 파노라마임을 강조해주세요.

  # =======================
  # 2. 구석기
  # =======================
  - output_name: "02_구석기_주먹도끼"
    search_keyword: |
      연천 전곡리 주먹도끼 특징 및 용도 (맥가이버 칼).
      아슐리안형 주먹도끼 발견의 세계사적 의의 (모비우스 학설 뒤집기).
      그렉 보웬(미군 병사) 발견 일화.
      https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?schM=view&showHallId=760&relicId=29836
      https://www.museum.go.kr/MUSEUM/contents/M0501000000.do?schM=view&relicRecommendId=166331&sc=&relicRecommendCategory=&pageSize=10&sv=
    script_gen_prompt: |
      [역할] 스토리텔러 도슨트
      [지시사항]
      1. 주먹도끼를 '구석기 시대의 맥가이버 칼'에 비유하여 설명하세요.
      2. 특히 이 돌멩이 하나가 세계 고고학의 역사를 어떻게 뒤집었는지(모비우스 학설 반박) 흥미진진하게 서술하세요.
      3. 미군 병사가 데이트 도중 발견했다는 비하인드 스토리를 짧게 곁들여 재미를 더하세요.

  - output_name: "03_구석기_고인류"
    search_keyword: |
      한반도 출토 구석기 시대 인골/화석.
      국립중앙박물관 전시실 내 인류 진화 모형.
      흥수아이 등 대표적인 고인류 화석의 의미.
      https://www.museum.go.kr/MUSEUM/contents/M0201030100.do?schM=view&showHallId=760&relicId=29840
    script_gen_prompt: |
      [지시사항]
      1. 우리 땅에 살았던 아주 오래전 사람들의 흔적을 이야기합니다.
      2. 전시된 뼈나 모형을 보며 당시 사람들의 삶이 지금과 어떻게 달랐을지, 혹은 얼마나 비슷했을지 상상력을 자극하는 질문을 던지세요.

  # =======================
  # 3. 신석기
  # =======================
  - output_name: "04_신석기_뼈바늘_가락바퀴"
    search_keyword: |
      신석기 뼈바늘과 가락바퀴 용도 및 사용법.
      신석기 혁명: 의복 제작의 의미.
      정착 생활과 생활 기술의 발달.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29855
    script_gen_prompt: |
      [지시사항]
      1. 아주 작은 유물인 뼈바늘과 가락바퀴에 주목하게 하세요.
      2. 이것이 단순한 도구가 아니라 인류가 '옷'을 지어 입기 시작했다는 '기술 혁명'의 증거임을 강조하세요.
      3. "이 작은 바늘귀에 실을 꿰던 신석기인의 손길을 상상해보세요"와 같은 감성적인 멘트를 포함하세요.

  - output_name: "05_신석기_고산리식토기"
    search_keyword: |
      제주 고산리식 토기 특징 (우리나라 가장 오래된 토기).
      식물 줄기를 섞어 만든 제작 기법.
      토기의 발명이 식생활에 미친 영향.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29856
    script_gen_prompt: |
      [지시사항]
      1. 빗살무늬토기 이전에 있었던, 우리나라에서 가장 오래된 토기인 '고산리식 토기'를 소개하세요.
      2. 흙에 식물 줄기를 섞어 만들었던 독특한 질감을 묘사하고, 토기가 생기면서 인류가 음식을 조리해 먹을 수 있게 된 변화를 설명해주세요.

  - output_name: "06_신석기_부산가덕도인골"
    search_keyword: |
      부산 가덕도 신석기 인골(굴장) 발굴 의미.
      신석기 시대 장례 풍습 및 DNA 분석 결과.
      당시 사람들의 체격과 생활상.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29880
    script_gen_prompt: |
      [지시사항]
      1. 신석기 시대 사람을 직접 마주하는 듯한 느낌으로 인골 전시를 소개하세요.
      2. 팔다리를 구부려 묻는 '굴장' 풍습과, 가덕도 유적에서 밝혀진 당시 사람들의 삶(유럽계 유전자 등 미스터리 포함 가능)을 흥미롭게 풀어주세요.

  # =======================
  # 4. 청동기
  # =======================
  - output_name: "07_청동기_민무늬토기"
    search_keyword: |
      청동기 시대 민무늬토기 특징 및 종류 (붉은 간 토기 등).
      빗살무늬토기와의 차이점.
      농경 사회 본격화와 잉여 생산물 저장 용도.
      https://www.museum.go.kr/MUSEUM/contents/M0201030200.do?schM=view&showHallId=760&relicId=29880
    script_gen_prompt: |
      [지시사항]
      1. 화려한 무늬가 사라지고 실용성이 강조된 '민무늬토기'의 변화를 설명하세요.
      2. 이것이 단순한 디자인 변화가 아니라, 농사를 짓고 곡식을 저장해야 했던 사회의 변화를 반영함을 연결해 설명해주세요.

  - output_name: "08_청동기_농경문청동기"
    search_keyword: |
      대전 괴정동 농경문 청동기 (농경문 청동 의기).
      새겨진 그림 분석: 밭 가는 모습, 항아리에 넣는 모습.
      청동기 시대의 제사 의식과 풍요 기원.
      https://www.museum.go.kr/MUSEUM/contents/M0201030300.do?schM=view&showHallId=760&relicId=10997
    script_gen_prompt: |
      [지시사항]
      1. 매우 작은 청동 조각이지만, 그 안에 2천 년 전의 풍경이 들어있음을 강조하며 자세히 들여다보게 하세요.
      2. 밭을 갈고 수확물을 담는 사람의 모습을 묘사하며, 당시 사람들이 가을의 풍요를 얼마나 간절히 기원했는지 감동적으로 전달하세요.

  # =======================
  # 5. 고조선·부여·삼한
  # =======================
  - output_name: "09_고조선_비파형동검"
    search_keyword: |
      비파형 동검(요령식 동검)의 형태적 특징 (악기 비파 모양).
      고조선의 세력 범위와 일치하는 출토 지역.
      실제 무기보다는 권력자의 상징물로서의 성격.
      https://www.museum.go.kr/MUSEUM/contents/M0201030400.do?schM=view&showHallId=760&relicId=29833
    script_gen_prompt: |
      [지시사항]
      1. 악기 '비파'를 닮은 우아한 곡선을 가진 이 검이 고조선 지배자의 권력을 상징함을 설명하세요.
      2. 날카로운 무기라기보다는 제사장이나 부족장의 위엄을 보여주는 '명품'이었음을 현대적 비유를 섞어 설명해주세요.

  - output_name: "10_고조선_통나무관"
    search_keyword: |
      창원 다호리 유적 통나무관 (목관묘).
      참나무를 반으로 갈라 만든 제작 방식.
      함께 묻힌 부장품(붓, 감 등)과 당시 장례 문화.
      https://www.museum.go.kr/MUSEUM/contents/M0201030400.do?schM=view&showHallId=760&relicId=29934
    script_gen_prompt: |
      [지시사항]
      1. 거대한 참나무 속을 파내어 만든 통나무관의 압도적인 실물을 묘사하세요.
      2. 이 관 안에 함께 넣었던 붓과 감 같은 부장품을 통해, 당시 사람들이 죽음 이후의 세계를 어떻게 준비했는지 차분하게 설명하세요.

  # =======================
  # 6. 고구려
  # =======================
  - output_name: "11_고구려_금동관"
    search_keyword: |
      고구려 금동관 특징 (불꽃 무늬 투조).
      신라 금관과의 차이점.
      고구려인의 기상과 역동적인 미적 감각.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=28
    script_gen_prompt: |
      [지시사항]
      1. 타오르는 불꽃 같은 무늬가 새겨진 금동관을 통해 고구려인의 힘찬 기상을 묘사하세요.
      2. 화려함보다는 강인함이 느껴지는 고구려 특유의 미감을 관람객이 느낄 수 있도록 유도하세요.

  - output_name: "12_고구려_짐승무늬수막새"
    search_keyword: |
      고구려 수막새 특징.
      부릅뜬 눈, 짐승 얼굴 무늬, 강렬한 인상.
      건축물의 위엄과 벽사(귀신을 쫓음)의 의미.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=43
    script_gen_prompt: |
      [지시사항]
      1. 기와 끝을 장식하던 수막새에 새겨진 부릅뜬 짐승의 얼굴을 보라고 하세요.
      2. 나쁜 기운을 쫓아내려는 고구려인들의 염원과, 건축물 하나에도 강렬함을 담았던 그들의 스타일을 설명하세요.

  - output_name: "13_고구려_광개토대왕릉비탁본"
    search_keyword: |
      국립중앙박물관 소장 광개토대왕릉비 원석 탁본.
      비석의 거대한 크기와 비문의 내용 요약 (정복 사업, 독자적 연호).
      동아시아 역사에서 갖는 사료적 가치.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=29932
    script_gen_prompt: |
      [지시사항]
      1. 전시실 한쪽 벽을 가득 채운 거대한 탁본 앞에 관람객을 세우세요.
      2. 만주 벌판에 서 있는 실제 비석의 웅장함을 상상하게 하고, 광개토대왕의 업적이 빼곡히 적힌 글자들의 역사적 무게감을 전달하세요.

  - output_name: "14_고구려_비늘갑옷"
    search_keyword: |
      고구려 철갑옷 (찰갑) 구조 및 특징.
      작은 철판을 엮어 만든 이유 (활동성).
      고구려 개마무사의 위력과 철 제련 기술.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=29925
    script_gen_prompt: |
      [지시사항]
      1. 수천 개의 작은 철 조각을 이어 붙인 비늘 갑옷(찰갑)의 정교함을 칭찬하세요.
      2. 말을 타고 달리며 활을 쏘았던 고구려 무사들에게 이 갑옷이 왜 최적이었는지(활동성, 방어력) 설명하며 '개마무사'의 위용을 떠올리게 하세요.

  - output_name: "15_고구려_연가7년불상"
    search_keyword: |
      연가 7년명 금동여래입상.
      광배 뒷면에 새겨진 명문의 내용(제작 연도, 제작자).
      고구려 불상의 투박하지만 따뜻한 미소와 옷주름 특징.
      https://www.museum.go.kr/MUSEUM/contents/M0201030500.do?schM=view&showHallId=760&relicId=29926
    script_gen_prompt: |
      [지시사항]
      1. 우리나라에서 제작 연대가 확실한 가장 오래된 불상 중 하나임을 밝히세요.
      2. 화려하기보다 소박하고 강인해 보이는 불상의 미소와, 광배 뒤에 새겨진 글씨가 들려주는 천 년 전 이야기를 전달하세요.

  # =======================
  # 7. 백제
  # =======================
  - output_name: "16_백제_치미"
    search_keyword: |
      백제 부여 부소산성/익산 미륵사지 출토 치미.
      치미의 용도(지붕 용마루 양 끝 장식).
      백제 건축의 웅장함과 세련된 곡선미.
      https://www.museum.go.kr/MUSEUM/contents/M0201030600.do?schM=view&showHallId=760&relicId=26998
    script_gen_prompt: |
      [지시사항]
      1. 거대한 크기의 '치미'를 보며 백제 왕실 건축물이 얼마나 웅장했을지 상상해보도록 유도하세요.
